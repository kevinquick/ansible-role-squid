---
- name: 'Ensure /etc/squid/conf.d exists'
  ansible.builtin.file:
    path: '/etc/squid/conf.d/'
    owner: 'root'
    group: 'root'
    mode: '0755'
    state: 'directory'

- name: 'Ensure allow- and blocklists'
  ansible.builtin.copy:
    dest: "/etc/squid/{{ item['name'] }}.acl"
    content: |
      # Managed by Ansible, your changes will be lost!
      {% for line in item['content'] %}
      {{ line }}
      {% endfor %}
    mode: '0444'
  notify: 'Restart squid'
  loop:
    - name: 'allowlist'
      content: "{{ squid_allowed_domains }}"
    - name: 'blocklist'
      content: "{{ squid_blocked_domains }}"
    - name: 'allowed_hosts'
      content: "{{ squid_allowed_hosts }}"
    - name: 'blocked_hosts'
      content: "{{ squid_blocked_hosts }}"

- name: 'Ensure custom Squid configurations'
  ansible.builtin.template:
    src: 'template.conf.j2'
    dest: "/etc/squid/conf.d/{{ item['name'] }}.conf"
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify: 'Restart squid'
  loop: "{{ squid_custom_config }}"
  when: squid_custom_config | length > 0

- name: 'Check if Squid sub-modules are present'
  ansible.builtin.find:
    paths: '/etc/squid/conf.d/'
    patterns: '*.conf'
  register: 'squid_find_result'

- name: 'Ensure there is at least 1 sub-module present'
  ansible.builtin.file:
    path: '/etc/squid/conf.d/default.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'
    state: 'touch'
  when: squid_find_result['matched'] == 0
  changed_when: false

- name: 'Generate HTTPS intercept private key'
  community.crypto.openssl_privatekey:
    path: "{{ squid_intercept_key_path }}"
    size: 2048
    owner: 'root'
    group: 'squid'
    mode: '0640'
  when:
    - squid_intercept_https_port is defined
    - squid_intercept_autogenerate | bool
  notify: 'Restart squid'

- name: 'Generate HTTPS intercept CSR'
  community.crypto.openssl_csr:
    path: "{{ squid_intercept_key_path | dirname }}/squid-intercept.csr"
    privatekey_path: "{{ squid_intercept_key_path }}"
    common_name: 'squid-intercept'
  when:
    - squid_intercept_https_port is defined
    - squid_intercept_autogenerate | bool

- name: 'Generate HTTPS intercept self-signed certificate'
  community.crypto.x509_certificate:
    path: "{{ squid_intercept_cert_path }}"
    privatekey_path: "{{ squid_intercept_key_path }}"
    csr_path: "{{ squid_intercept_key_path | dirname }}/squid-intercept.csr"
    provider: 'selfsigned'
    selfsigned_not_after: '+3650d'
    owner: 'root'
    group: 'squid'
    mode: '0640'
  when:
    - squid_intercept_https_port is defined
    - squid_intercept_autogenerate | bool
  notify: 'Restart squid'

- name: 'Ensure Squid config'
  ansible.builtin.template:
    src: 'squid.conf.j2'
    dest: '/etc/squid/squid.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify: 'Restart squid'
