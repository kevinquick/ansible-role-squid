---
# Port that Squid listens on
squid_port: 3128

# ACLs for allowing or blocking destination domains
squid_allowed_domains: []
squid_blocked_domains: []
# ACLs for allowing or blocking hosts from having full Internet access
squid_allowed_hosts: []
squid_blocked_hosts: []

# Default ports allowed for SSL
squid_ssl_ports:
  - 443

# Default ports allowed for CONNECT method
squid_safe_ports:
  - 80
  - 443

# Configure upstream proxy, if any
squid_upstream_proxy: false
squid_cache_peer_host: ''
squid_cache_peer_port: ''

# Extra, custom, ACLs
squid_access_control_list: []
# squid_access_control_list:
#   - name: 'my_acl'
#     type: 'dstdomain'
#     arg: '/etc/squid/my_acl.acl'

# http_access permissions for configured ACLs
squid_http_access: []

squid_refresh_patterns:
  - case_sensitive: false
    regex: '^ftp:'
    min: 1440
    percent: '20%'
    max: 10080
    opts: ''
  - case_sensitive: false
    regex: '^gopher:'
    min: 1440
    percent: '0%'
    max: 1440
    opts: ''
  - case_sensitive: true
    regex: '(/cgi-bin/|\?)'
    min: 0
    percent: '0%'
    max: 0
    opts: ''
  - case_sensitive: false
    regex: '.'
    min: 0
    percent: 20%
    max: 4320
    opts: ''

# Storage locations used by Squid
squid_diskcache: 'ufs /var/spool/squid 100 16 256'
squid_coredumpdir: '/var/spool/squid'

# Timeout + buffer tuning. Unset = Squid default.
# squid_read_timeout: '15 minutes'
# squid_request_timeout: '5 minutes'
# squid_forward_timeout: '4 minutes'
# squid_pconn_timeout: '1 minute'
# squid_client_request_buffer_max_size: '512 KB'
# squid_tcp_recv_bufsize: 0
# squid_half_closed_clients: false

# Response for denied requests. Rendered as `deny_info <value> all`. Unset for Squid default.
# squid_deny_response: 'TCP_RESET'

# Transparent HTTPS intercept port. When set, adds a second listener in SNI-splice
# mode (no decryption, no CA required). Unset to disable.
# squid_intercept_https_port: 3129

# Listener cert/key paths. Override to bring your own PKI; leave as default for
# auto-generated self-signed material.
squid_intercept_cert_path: '/etc/squid/squid-intercept.crt'
squid_intercept_key_path: '/etc/squid/squid-intercept.key'

# Auto-generate a self-signed cert/key pair at the paths above. Set to false to
# manage the files yourself (they must already exist when the role runs).
squid_intercept_autogenerate: true

# For use with custom configurations only
squid_custom_config: []

# Example for custom_config
# squid_custom_config:
# - name: 'example'
#   ssl_ports: []
#   safe_ports: []
#   access_control:
#   - name: 'aclname'
#     type: 'src'
#     arg: '127.0.0.1/32'
#   http_access: []
#   refresh_patterns:
#   - case_sensitive: false
#     regex: 'regex'
#     min: 0
#     percent: 0%
#     max: 0
#     opts: ''
#   allowed_ips: []
